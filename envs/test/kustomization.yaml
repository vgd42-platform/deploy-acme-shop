# test: changed only by a promotion PR from dev; needs the vendor lead (code owner) approval.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# --- Version label (read by the 360 view), set together with the image ---
labels:
  - pairs:
      app.kubernetes.io/version: "1.0.0"
    includeSelectors: false
    includeTemplates: true
# --- The image this environment runs, pinned by digest ---
images:
  - name: app-image
    newName: acrvgd42.azurecr.io/acme/shop
    digest: sha256:d374ba63e3aaf7e5daae7e2798fe7724312160d6230f0dc3ad8572841f15183a
