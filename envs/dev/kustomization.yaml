# dev: updated automatically by the platform build (a PR per commit, merges itself when checks pass).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# --- Version label (read by the 360 view), set together with the image ---
labels:
  - pairs:
      app.kubernetes.io/version: "1.2.0"
    includeSelectors: false
    includeTemplates: true
# --- The image this environment runs, pinned by digest ---
images:
  - name: app-image
    newName: acrvgd42.azurecr.io/acme/shop
    digest: sha256:96a9edcb628735830728744514365dbcc7bbed6ad3f99712ebbfe45a381bd1a0
